<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hex Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="calculator">

    <h1 class="calculator__title">Hex Calculator</h1>

    <div class="calculator__display">
      <div class="calculator__expression" id="expression"></div>
      <div class="calculator__result" id="display">0</div>
    </div>

    <div class="calculator__buttons">

      <!-- Row 1: A B C Clear -->
      <button class="btn btn--hex" data-value="A">A</button>
      <button class="btn btn--hex" data-value="B">B</button>
      <button class="btn btn--hex" data-value="C">C</button>
      <button class="btn btn--action" id="clear">CL</button>
      

      <!-- Row 2: E F D Backspace -->
      <button class="btn btn--hex" data-value="E">E</button>
      <button class="btn btn--hex" data-value="F">F</button>
      <button class="btn btn--hex" data-value="D">D</button>
      <button class="btn btn--action" id="backspace">⌫</button>
      

      <!-- Row 3: 7 8 9 + -->
      <button class="btn btn--number" data-value="7">7</button>
      <button class="btn btn--number" data-value="8">8</button>
      <button class="btn btn--number" data-value="9">9</button>
      <button class="btn btn--operator" data-operator="+">+</button>

      <!-- Row 4: 4 5 6 - -->
      <button class="btn btn--number" data-value="4">4</button>
      <button class="btn btn--number" data-value="5">5</button>
      <button class="btn btn--number" data-value="6">6</button>
      <button class="btn btn--operator" data-operator="-">−</button>

      <!-- Row 5: 1 2 3 x -->
      <button class="btn btn--number" data-value="1">1</button>
      <button class="btn btn--number" data-value="2">2</button>
      <button class="btn btn--number" data-value="3">3</button>
      <button class="btn btn--operator" data-operator="*">×</button>

      <!-- Row 6: 0 (double width) = (double width) ÷ -->
      <button class="btn btn--number" data-value="0">0</button>
      <button class="btn btn--equals btn--span2" id="equals">=</button>
      <button class="btn btn--operator" data-operator="/">÷</button>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
